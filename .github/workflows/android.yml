name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-configuration-cache assembleDebug

      - name: Run unit tests
        run: ./gradlew --no-configuration-cache testDebugUnitTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyLedger-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish "latest" release with APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MoneyLedger.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MoneyLedger.apk \
            --title "MoneyLedger (latest build)" \
            --notes "Debug APK built from ${GITHUB_SHA}. Download MoneyLedger.apk on your Android phone and install it."
